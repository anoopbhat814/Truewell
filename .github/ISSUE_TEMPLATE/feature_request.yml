name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected (patients, clinicians, billing staff) and what is hard today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: { required: true }
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security considerations
      description: Does this touch PHI, authentication or audit logging?
