apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truewell
  namespace: truewell
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.truewell.example]
      secretName: truewell-tls
  rules:
    - host: app.truewell.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: truewell-web, port: { number: 80 } } }
